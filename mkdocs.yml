site_name: FineNav
site_description: Developer documentation for the FineNav navigation ecosystem
site_url: https://finenav.github.io/
repo_url: https://github.com/FineNav/FineNav.github.io
repo_name: FineNav/FineNav.github.io
docs_dir: docs
site_dir: site
use_directory_urls: true
hooks:
  - scripts/multirepo_i18n.py

theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: red
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - multirepo:
      cleanup: true
      keep_docs_dir: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          nav_translations:
            finenav-engine: FineNav-Engine
        - locale: zh
          name: 中文
          site_name: FineNav 开发者文档
          nav_translations:
            Ecosystem Overview: 生态总览
            finenav-engine: FineNav-Engine
            Overview: 项目总览
            Quickstart: 快速开始
            Using FineNav: 使用 FineNav
            Choose Map and Planner: 选择 Map 和 Planner
            Write a WorldView: 编写 WorldView
            Configure Your Application: 配置应用
            FineNav Plugins: FineNav 插件
            Maps: 地图组件
            Planners: 规划组件
            Advanced: 进阶使用
            Custom Planner: 自定义 Planner
            Custom Map: 自定义 Map

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Ecosystem Overview: index.md
  - finenav-engine: '!import https://github.com/FineNav/FineNav-Engine?branch=dev'
