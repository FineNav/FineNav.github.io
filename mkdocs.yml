site_name: FineNav
site_description: Developer documentation for the FineNav navigation ecosystem
site_url: https://finenav.github.io/
repo_url: https://github.com/FineNav
repo_name: FineNav
docs_dir: docs
site_dir: site
use_directory_urls: true
extra_css:
  - assets/stylesheets/overview.css
hooks:
  - scripts/multirepo_i18n.py

theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: red
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - multirepo:
      cleanup: true
      keep_docs_dir: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          nav_translations:
            finenav-engine: FineNav-Engine
        - locale: zh
          name: 中文
          site_name: FineNav 开发者文档
          nav_translations:
            finenav-engine: FineNav-Engine
            Overview: 项目总览
            Why FineNav-Engine?: 为什么选择 FineNav-Engine？
            Installation: 如何安装
            Getting Started: 入门教程
            1. Run the example: 1. 运行示例，查看效果
            2. Choose Map and Planner: 2. 选择 Map 和 Planner
            3. Write a WorldView: 3. 编写 WorldView
            4. Assemble a control pipeline: 4. 组装控制 Pipeline
            5. Configure a Behavior Tree: 5. 按需求配置行为树
            Custom Planner: 自定义 Planner
            Custom Map: 自定义 Map
            FineNav (ICRA 2026): FineNav (ICRA 2026)

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Overview: index.md
  - finenav-engine: '!import https://github.com/FineNav/FineNav-Engine?branch=dev'
  - FineNav-SlamBox: slambox.md
  - FineNav (ICRA 2026): icra.md
