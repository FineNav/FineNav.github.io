name: Deploy FineNav documentation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finenav-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build bilingual site
        env:
          GithubAccessToken: ${{ secrets.DOCS_READ_TOKEN }}
        run: |
          if [ -z "$GithubAccessToken" ]; then
            echo '::error::Set DOCS_READ_TOKEN to a token with read access to the private module repositories.'
            exit 1
          fi
          python -m mkdocs build --strict
          python scripts/validate_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
